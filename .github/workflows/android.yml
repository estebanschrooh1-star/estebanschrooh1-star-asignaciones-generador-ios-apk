name: Compilar Android (APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: npm run prepare:web

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar logo de la app
        run: cp -r resources/android-res/. android/app/src/main/res/

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Asignaciones-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
