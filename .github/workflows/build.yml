name: Compilar APK y publicar PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar una actualización (Release) para la app de Android'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---------- Android ----------
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para contar los commits

      # Versión = (archivo VERSION, o "version" de package.json) + n.º de commits
      - name: Calcular la versión
        id: ver
        run: |
          if [ -f VERSION ]; then
            BASE="$(tr -d '[:space:]' < VERSION)"
          else
            BASE="$(node -p "require('./package.json').version")"
          fi
          echo "v=$BASE.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: npm run prepare:web

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar logo de la app
        run: cp -r resources/android-res/. android/app/src/main/res/

      - name: Agregar funciones nativas (WhatsApp directo)
        run: node scripts/android-native.js

      # Así cada APK publicado tiene un número de versión mayor y Android permite actualizar
      - name: Aplicar versión al APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.v }}
          VERSION_CODE: ${{ steps.ver.outputs.count }}
        run: |
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Usar clave de firma fija (para poder actualizar la app sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp resources/signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Asignaciones-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------- Release automática (solo APK de Android) ----------
  release:
    needs: apk
    # Solo se publica cuando lo pedís a mano: Actions → Run workflow → marcar "Publicar".
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Asignaciones-APK
          path: dist

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VN: ${{ needs.apk.outputs.version }}
        run: |
          TAG="v$VN"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $VN ya tiene release; no hay nada nuevo que publicar."
            exit 0
          fi
          cp dist/app-debug.apk "Asignaciones-v$VN.apk"
          gh release create "$TAG" "Asignaciones-v$VN.apk" --repo "$GITHUB_REPOSITORY" \
            --title "Asignaciones $VN" \
            --notes "Asignaciones $VN" \
            --target "$GITHUB_SHA" --latest

  # ---------- iPhone / iPad (PWA en GitHub Pages) ----------
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: npm run prepare:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: pwa
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
